[project]
name = "infographic"
version = "0.1.0"
description = "Create and refine styled single- and multi-panel infographics with Amplifier Agent and image generation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "amplifier-agent[github-copilot] @ git+https://github.com/microsoft/amplifier-agent@v0.22.0#subdirectory=packages/python",
    "filelock>=3,<5",
    "google-genai>=1,<3",
    "jsonschema>=4.26.0,<5.0.0",
    "pillow>=11,<13",
    "pydantic>=2.13,<3.0",
    "pyyaml>=6.0.3,<7.0.0",
    "typer>=0.27.2,<0.28.0",
]

[project.urls]
Repository = "https://github.com/robotdad/amplifier-smart-tool-infographic"

[project.scripts]
infographic = "infographic.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "infographic"

[tool.uv]
add-bounds = "major"
default-groups = "all"

[dependency-groups]
dev = [
    "playwright>=1.58,<2",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "ty>=0.0.79",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
