name: Website

on:
  pull_request:
    paths: ['site/**', 'tests/test_site.py', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['site/**', 'tests/test_site.py', '.github/workflows/website.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish main to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install site check dependencies
        run: python -m pip install pytest pillow pyyaml
      - name: Check site
        run: python -m pytest -c /dev/null --rootdir=. tests/test_site.py
      - name: Build static website (canonical family owner is microsoft)
        run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
